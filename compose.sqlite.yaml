# Local SQLite deployment.
# Compose reads .env (or exported shell variables) for application secrets;
# the optional env_file passes those values to the containers without adding
# the file to the Docker build context.
services:
  app:
    image: ${IMAGE_NAME:-friendlink-verify:local}
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_PROVIDER: sqlite
      SQLITE_PATH: /data/friendlink.db
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    volumes:
      - sqlite_data:/data
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/api/health?ready=1').then(r =>
          process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  migrate:
    image: ${IMAGE_NAME:-friendlink-verify:local}
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_PROVIDER: sqlite
      SQLITE_PATH: /data/friendlink.db
    volumes:
      - sqlite_data:/data
    # The migration script is the follow-up interface agreed for this image.
    # It is intentionally a one-shot service and must finish before app starts.
    command: ["npm", "run", "db:migrate"]
    restart: "no"

volumes:
  sqlite_data:
    name: friendlink_verify_sqlite_data
